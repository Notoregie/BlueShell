name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .Net
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BlueShell.slnx

      - name: Build
        run: dotnet build BlueShell.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BlueShell.slnx --no-build --verbosity normal